# This conf has never passed calibration.  Measured on device (tools/site_probe,
# MEIZU 21 Pro, 6.1.25-android14-11-maybe-dirty):
#
#   timer_site low21 must be 0x190578 (the trace event reports the call site as
#   bl+4, and the previous value was the bare bl address, the same off-by-4 the
#   Meizu 22 profile had).  The copy_process anchor corroborates it: measured
#   0xffffffd7b66ad2b8, whose distance to the timer site is -0xe32c0, matching
#   copy_process_low21 - timer_low21 = -0xe32cc exactly.
#
#   The high bits of the link-time address are NOT known: the previous value was
#   17 hex digits long, which does not decode to a valid kernel virtual address.
#   g_slide = site0 - timer_site, so every link-time symbol below
