#
# This kernel's release string ("-maybe-dirty") is not unique to one vendor
# build, so it lives under dirty/ and UserService additionally verifies the
# identity fields below against the device before using this conf.
# Identity uses only AOSP-standard properties (no vendor build strings).
device_model = "MEIZU 22"
android_release = "16"
sdk_int = 36

release = "6.6.66-android15-8-maybe-dirty-4k"
schema_version = 1
ksu_kmi = "android15-6.6"

# do_timer_create -> kmem_cache_alloc(posix_timers_cache) call site
# posix_timers_cache = kmem_cache_create(..., size=0x108, align=0, flags=0x4040000, ctor=NULL)
# (SLAB_ACCOUNT only, no SLAB_HWCACHE_ALIGN -> object size stays 0x108)
#
# timer_site is the link-time address of the call site; the exploit compares
# only its low 21 bits (KASLR slides the image by whole 2MB blocks) and derives
# the runtime slide from the full value.  Verified on device: the trace event
# reports call_site = bl+4, observed 0xffffffe49ef92bac at runtime, i.e.
# slide = 0x41d600000 (2MB aligned), which yields link-time 0xffffffc080192bac.
timer_site = 0xffffffc080192bac
timer_alloc = 0x108

# cred_jar: sizeof(struct cred)=0xb8, slab object=0xc0
# cred_init: kmem_cache_create("cred_jar", 0xb8, 0, 0x40402000, NULL)
# flags 0x40402000 = SLAB_ACCOUNT|SLAB_DEBUG_OBJECTS|SLAB_HWCACHE_ALIGN(0x2000)
# -> SLUB calculate_sizes rounds size up to cache line(64B): ALIGN(0xb8,64)=0xc0
# sizeof(cred)=0xb8 is the 6.6 layout (atomic_long_t usage -> uid at 0x8), the
# same as the verified PKT110 6.6.118 profile; do not use the 6.1 layout (0xb0,
# atomic_t usage, uid at 0x4) here.
cred_req = 0xb8
cred_alloc = 0xc0
cred_uid_off = 0x8

# link-time symbols (kallsyms)
selinux_state = 0xffffffc082305150
panic_on_warn = 0xffffffc0820bae08

# task_struct / cred layout (BTF)
# 6.6 layout: sizeof(task_struct)=0x12c0 (verified: the task_struct alloc site
# matches with task_recs=1) and cred at 0x820, the same offsets as the verified
# PKT110 6.6.118 profile.  The 0x838 / uid-at-0x4 values belong to the 6.1
# layout (sizeof(cred)=0xb0, atomic_t usage) and must not be used here.
task_cred_off = 0x820
copy_process_low21 = 0xa9bb4
task_alloc_bytes = 0x12c0

# capability and fake-cred refcounted sub-objects
