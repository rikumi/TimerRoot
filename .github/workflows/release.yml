name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -n 1)"
          echo "Using sdkmanager: $sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          # compileSdk 37 -> platforms;android-37.0, AGP 9.1 -> build-tools;36.0.0
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Read version name
        id: version
        run: |
          version_name="$(sed -n "s/.*versionName[[:space:]]*'\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)"
          if [[ -z "$version_name" ]]; then
            echo "::error::Failed to parse versionName from app/build.gradle"
            exit 1
          fi
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Decode keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::notice::ANDROID_KEYSTORE_BASE64 secret is not set, the APK will be published unsigned"
            echo "decoded=false" >> "$GITHUB_OUTPUT"
          else
            path="$RUNNER_TEMP/release.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$path"
            echo "decoded=true" >> "$GITHUB_OUTPUT"
            echo "path=$path" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign release APK
        id: sign
        if: steps.keystore.outputs.decoded == 'true'
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets are required when ANDROID_KEYSTORE_BASE64 is set"
            exit 1
          fi
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          sign_args=(sign
            --ks "$KEYSTORE_PATH"
            --ks-pass "pass:$KEYSTORE_PASSWORD"
            --ks-key-alias "$KEY_ALIAS")
          if [[ -n "$KEY_PASSWORD" ]]; then
            sign_args+=(--key-pass "pass:$KEY_PASSWORD")
          fi
          # zipalign first, then sign: apksigner preserves the alignment
          "$build_tools/zipalign" -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
          "$build_tools/apksigner" "${sign_args[@]}" \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Collect release APK
        id: apk
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          out="app/build/outputs/apk/release"
          mkdir -p dist
          if [[ "$SIGNED" == "true" ]]; then
            cp "$out/app-release.apk" "dist/TimerRoot-$VERSION_NAME.apk"
          else
            cp "$out/app-release-unsigned.apk" "dist/TimerRoot-$VERSION_NAME-unsigned.apk"
          fi
          echo "path=$(ls dist/*.apk)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimerRoot-${{ steps.version.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "TimerRoot $VERSION_NAME" \
              --generate-notes \
              --latest
          fi
